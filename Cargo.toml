[package]
name = "atmoweb-tui"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "A terminal UI for monitoring and controlling an oven via the AtmoWeb API"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/UlmerMan/atmoWEB-tui"
homepage = "https://github.com/UlmerMan/atmoWEB-tui"
keywords = ["tui", "ratatui", "memmert", "oven", "temperature"]
categories = ["command-line-utilities"]

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1"
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
ratatui-textarea = "0.9.2"
