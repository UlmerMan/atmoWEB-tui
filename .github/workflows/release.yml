name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_to_crates_io:
        description: 'Publish to crates.io'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ci:
    name: CI Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Verify package readiness
        run: cargo package --no-verify

  publish-crates-io:
    name: Publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_to_crates_io == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Error: CRATES_IO_TOKEN secret is not set."
            exit 1
          fi
          cargo publish --token "$CARGO_REGISTRY_TOKEN"

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: atmoweb-tui
            asset_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: atmoweb-tui
            asset_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: atmoweb-tui.exe
            asset_ext: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Extract tag name or version
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          ARCHIVE_NAME="atmoweb-tui-${VERSION}-${{ matrix.target }}.tar.gz"
          cd target/${{ matrix.target }}/release
          tar czvf "../../../${ARCHIVE_NAME}" "${{ matrix.binary_name }}"
          cd ../../../
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $Version = "${{ steps.vars.outputs.version }}"
          $ArchiveName = "atmoweb-tui-${Version}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath $ArchiveName
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -FilePath "${ArchiveName}.sha256" -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            atmoweb-tui-*.*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [publish-crates-io, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: assets-*
          merge-multiple: true

      - name: Extract tag name or version
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
